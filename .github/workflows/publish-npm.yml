# Publishes an existing release tag to npm, e.g. when the npm step of a release failed.
# Run it from the Actions tab: "Publish to npm" -> Run workflow -> enter the tag.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm test

      - name: Publish
        run: |
          spec="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm; nothing to do."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
