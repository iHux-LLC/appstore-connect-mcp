# Push a tag like v0.2.0 (matching package.json) to publish:
# the Claude Desktop extension goes to GitHub Releases, the package goes to npm.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle

      # Both steps tolerate a previous partial run, so a failed release can simply be re-run.
      - name: Create GitHub Release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/appstore-connect.mcpb "build/appstore-connect-$GITHUB_REF_NAME.mcpb"
          files=(build/appstore-connect.mcpb "build/appstore-connect-$GITHUB_REF_NAME.mcpb")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Publish to npm
        run: |
          spec="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm; skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
