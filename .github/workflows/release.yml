# Push a tag like v0.2.0 (matching package.json) to publish:
# the Claude Desktop extension goes to GitHub Releases, the package goes to npm.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle

      - name: Create GitHub Release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/appstore-connect.mcpb "build/appstore-connect-$GITHUB_REF_NAME.mcpb"
          gh release create "$GITHUB_REF_NAME" \
            build/appstore-connect.mcpb "build/appstore-connect-$GITHUB_REF_NAME.mcpb" \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
